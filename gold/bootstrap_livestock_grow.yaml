- id: G-131
  type: unanswerable_adversarial
  provenance: field_sourced
  question_bn: "ছাগলের বিমা করা যাবে কি? প্রিমিয়াম কত?"
  question_variants:
    - "ভেড়া বা ছাগলের জন্য গবাদিপ্রাণি সুরক্ষা বিমা আছে?"
    - "chagol er bima hoy?"
  manual_scope: livestock_grow
  answerable: "no"
  gold_facts:
    - "দুগ্ধজাত গাভী"
    - "গরু মোটাতাজাকরণ"
  must_cite: []
  source_refs:
    - chunk_id: TODO
