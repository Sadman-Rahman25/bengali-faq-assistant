      clause: null            # narrative manual, no section numbers
      # resolved from the fact(s) unique to this chunk; every other
      # fact of this question also occurs here verbatim, but is not
      # unique to it -- 'প্রকল্প'=35 chunks, 'গবাদিপ্রাণি সুরক্ষা বিমা'=20 chunks
