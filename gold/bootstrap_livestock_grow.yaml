      # so no ref can be named without picking. Candidate counts:
      #   'দুগ্ধজাত গাভী' -> 6 chunk(s)
      #   'গরু মোটাতাজাকরণ' -> 5 chunk(s)
  # Every premium rate in the manual. Quoting any of them in answer to a
  # question about goats is the violation this question exists to catch --
  # it is how a cattle rate gets applied to an uncovered animal. Mechanised
  # here rather than left as prose in notes, because the abstention check
  # alone would pass an answer that hedged and still quoted a rate.
  must_not_contain_literals: ["১.৮০%", "১.৯০%", "১.৬০%", "২.৩৫%", "২.৪০%"]
  difficulty: hard
  notes: >
    HIGHEST-RISK QUESTION IN THE SET, and a real field question -- ছাগল
    occurs ZERO times in this manual. It covers exactly two products, both
    cattle: দুগ্ধজাত গাভী (গাভী গরু only) and গরু মোটাতাজাকরণ (ষাঁড় only).
    The plausible wrong answer is a premium rate lifted from one of those
    and applied to a goat, formatted exactly like a right answer. Any
    percentage in the response is a violation. The correct answer names what
    IS covered and says goats are not.

