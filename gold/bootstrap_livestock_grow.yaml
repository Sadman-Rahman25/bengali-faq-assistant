# Bootstrap gold set -- Livestock Grow ("গবাদিপ্রাণি সুরক্ষা বিমা" অপারেশন
# ম্যানুয়াল), 15 questions.
#
# PROVENANCE MATTERS AND IS RECORDED PER QUESTION.
#   chunk_derived : written while looking at a chunk, copying corpus spelling.
#                   Tests retrieval mechanics. Shares assumptions with the
#                   code, so it measures agreement, not correctness.
#   field_sourced : an officer's own wording and spelling, unedited.
#                   Tests vocabulary coverage.
# NEVER report a merged score across the two. The digit-fold classifier
# scored 7/7 against self-written sentences using বীমা where the corpus says
# বিমা -- that is what a merged score hides.
#
# gold_facts are written as the checkable Bengali literal or the figure, per
# PDF_INGEST.md. English prose facts cannot be matched by the deterministic
# matcher and are reported separately; the explanation goes in notes.

meta:
  version: 2
  created: 2026-09-13
  manuals: [dabi_2025, progoti, livestock_grow_2026]
  new_manual: livestock_grow_2026

  source_status: >
    INGESTED FROM A TRANSCRIPTION, NOT FROM THE PDF.
    data/raw/Operational Manual_Livestock (2026).pdf has an unrecoverable
    text layer: all six extraction routes return identical corruption
    (coverage 25.0%, 56.3 malformed/1000) and the embedded Kalpurush subsets
    name 497 of 586 glyphs `glyph000NN` with GSUB stripped, so the conjuncts
    cannot be repaired from the font. No .docx exists -- it was requested.
    The 8 pages were therefore transcribed from 200dpi renders into
    data/raw/livestock_grow_2026_transcribed.md and chunked by ex_text.py.
    source_type = "ocr", extraction_confidence = "unverified".
    Every figure below was read off the render, but a second human should
    confirm them against out/livestock_grow_2026/figure_worklist.html before
    these scores are quoted anywhere.

  document_shape: >
    NOT a clause-numbered manual. 8 pages of narrative with bold headings;
    its only numbered lines are exclusion lists and ধাপ ১-৬ procedures.
    There is no §-style spine, so must_cite carries the manual_id and, where
    it helps, the heading -- never a § number. pdf_structure.py correctly
    fails this document at a 21.9% orphan rate; that is why ex_text.py
    exists.

  product_identity: >
    RESOLVED. "লাইভস্টক গ্রো" is a PROJECT of ব্র্যাক মাইক্রোফাইন্যান্স কর্মসূচি
    with four pillars -- আর্থিক সহায়তা (স্বাধীন ঋণ for গরু পালন / গরু
    মোটাতাজাকরণ), স্বাস্থ্য ও পুষ্টি, গবাদিপ্রাণি সুরক্ষা বিমা, and মার্কেটিং.
    THIS MANUAL covers only the third pillar, the insurance. So
    productmatch's alias লাইভস্টক গ্রো -> livestock_insurance is right for
    this manual's scope, and the loan pillar is a separate product
    (shadhin_loan) that this manual names once, in the overview diagram.
    Two things for reconcile.py:
      * the registry flattens a project/product/sub-product hierarchy --
        Livestock Grow (project) > গবাদিপ্রাণি সুরক্ষা বিমা (product) >
        দুগ্ধজাত গাভী + গরু মোটাতাজাকরণ (already separate NAMED keys).
      * this manual serves BOTH programmes (দাবি and প্রগতি appear 2 and 1
        times), so programmes_in tags only 2 of 36 chunks. A
        programme-scoped retrieval filter would exclude almost all of it.

  new_vocabulary: >
    Absent from the registries and worth a decision before embedding:
      roles   -- সিএসএ (CSA, p6) and উপজেলা হিসাব ব্যবস্থাপক (p7) are not in
                 roles.py's ROLES table.
      codes   -- UPG / IDP / CCP / AI / WVB / SS lead appear as referrer
                 codes on the enrolment form (p6) and none are in
                 productmatch.PROGRAMME_NAMES.
      note    -- roles.py overcounts programme_assistant here: পিএ matches
                 inside পিএলসি, and this manual names two insurance পিএলসি.

  note: >
    3 of 15 unanswerable (20%). It will feel high and it is correct,
    because every corpus gap is a question an officer will actually ask and
    the failure mode is confident invention, not silence.

