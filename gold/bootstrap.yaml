- id: G-212
  type: role_scoped_authority
  provenance: chunk_derived
  question_bn: "দাবি কর্মসূচিতে মামলা সংক্রান্ত বিল-ভাউচার কে অনুমোদন করবেন?"
  role_context: cdo
  manual_scope: dabi
  answerable: "yes"
  gold_facts:
    - text: "আঞ্চলিক ব্যবস্থাপক কর্তৃক সাময়িক অনুমোদন প্রাপ্তি সাপেক্ষে দাবি কর্মসূচির ক্ষেত্রে সংশ্লিষ্ট শাখা ব্যবস্থাপক বিল-ভাউচার অনুমোদন করবেন।"
      kind: literal
      ref: dabi_2025_0136
      verified_against: corpus
  must_cite: ["dabi_2025 §3.9.6"]
  must_not_contain_literals: ["এলাকা ব্যবস্থাপক"]
  source_refs:
    - chunk_id: dabi_2025_0136
      manual_id: dabi_2025
      clause: "৩.৯.৬"
  verification_status: unverified
  difficulty: hard
  notes: >
    REWRITTEN 2026-09-17, off §3.9.1/§3.9.2 and onto §3.9.6. The old ref
    (dabi_2025_0121, §3.9.1) carries no approval sentence in its body at
    all -- it is the preamble listing what to check BEFORE acting -- and the
    old fact was the bare token আরএম, which appears in §3.9 as applicant and
    as assistant, never as the bill-voucher approver. §3.9.6 is the only
    clause in §3.9 that names one.
    The fact is the chunk own sentence, quoted verbatim, not a role token;
    on a one-token fact "the string is present" and "the chunk answers the
    question" come apart badly.
    must_not_contain এলাকা ব্যবস্থাপক is the real trap. That is the PROGOTI
    approver, and dabi_2025_0136 contains the string inside
    "শাখা/এলাকা ব্যবস্থাপক (দাবি)" in its first sentence -- so a system that
    retrieves the right chunk and reads the wrong sentence hands a Dabi
    officer the Progoti answer. Mirror of G-213; both must pass.

- id: G-213
  type: role_scoped_authority
  provenance: chunk_derived
  question_bn: "প্রগতি কর্মসূচিতে মামলা সংক্রান্ত বিল-ভাউচার কে অনুমোদন করবেন?"
  role_context: po
  manual_scope: progoti
  answerable: "yes"
  gold_facts:
    - text: "প্রগতি কর্মসূচির ক্ষেত্রে সংশ্লিষ্ট এলাকা ব্যবস্থাপক এতদসংক্রান্ত বিল-ভাউচার অনুমোদন করবেন।"
      kind: literal
      ref: progoti_0152
      verified_against: corpus
  must_cite: ["progoti §3.9.6"]
  must_not_contain_literals: ["শাখা ব্যবস্থাপক"]
  source_refs:
    - chunk_id: progoti_0152
      manual_id: progoti
      clause: "৩.৯.৬"
  verification_status: unverified
  difficulty: hard
  notes: >
    REWRITTEN 2026-09-17, off §3.9.1 and onto §3.9.6. The old ref
    (progoti_0133) contains আরএম but no approval statement; see G-212.
    THE FACT IS A TRIMMED SPAN, not the whole sentence. The bill-voucher
    sentence in progoti_0152 names BOTH programmes in one sentence, so
    quoting it whole would put শাখা ব্যবস্থাপক -- this question own
    forbidden literal -- inside its own gold fact. The span kept runs from
    "প্রগতি কর্মসূচির ক্ষেত্রে" to the full stop: the shortest contiguous
    substring holding both the role and অনুমোদন করবেন.
    Mirror of G-212. One passing alone means the system picked a programme
    and got lucky.

- id: G-214
  type: role_scoped_authority
  provenance: chunk_derived
  question_bn: "মামলা সংক্রান্ত সাময়িক খরচ ও বিল-ভাউচার কে অনুমোদন করবেন?"
  manual_scope: ambiguous
  answerable: partial
  gold_facts:
    - text: "আঞ্চলিক ব্যবস্থাপক"
      kind: literal
      ref: progoti_0152
      verified_against: corpus
    - text: "আঞ্চলিক ব্যবস্থাপক কর্তৃক সাময়িক অনুমোদন প্রাপ্তি সাপেক্ষে দাবি কর্মসূচির ক্ষেত্রে সংশ্লিষ্ট শাখা ব্যবস্থাপক এবং প্রগতি কর্মসূচির ক্ষেত্রে সংশ্লিষ্ট এলাকা ব্যবস্থাপক এতদসংক্রান্ত বিল-ভাউচার অনুমোদন করবেন।"
      kind: literal
      ref: progoti_0152
      verified_against: corpus
    - text: "কর্মসূচি অনুযায়ী বিল-ভাউচার অনুমোদনকারী ভিন্ন"
      kind: claim
      verified_against: corpus
  must_cite: ["progoti §3.9.6", "dabi_2025 §3.9.6"]
  must_not_contain_literals: []
  source_refs:
    - chunk_id: progoti_0152
      manual_id: progoti
      clause: "৩.৯.৬"
    - chunk_id: dabi_2025_0136
      manual_id: dabi_2025
      clause: "৩.৯.৬"
  verification_status: unverified
  difficulty: hard
  notes: >
    REWRITTEN 2026-09-17, off §3.9.2 and onto §3.9.6. No programme given,
    so the correct answer names both, or asks which programme.
    TWO LEVELS, and they differ. The PROVISIONAL EXPENSE is approved by
    আঞ্চলিক ব্যবস্থাপক in both programmes. The BILL-VOUCHER approver splits:
    শাখা ব্যবস্থাপক for দাবি, এলাকা ব্যবস্থাপক for প্রগতি. An answer that
    gives one level in place of the other is wrong.
    Fact 1 is a bare role token, which §3.9 otherwise shows to be unsafe --
    আঞ্চলিক ব্যবস্থাপক occurs in many chunks. It is acceptable HERE only
    because it carries an explicit per-fact ref: the chunk was chosen by
    the clause, not found by searching for the token, which is exactly the
    failure that produced the previous version of this question.
    Fact 3 is a claim and carries no ref, so with two source_refs it
    reports as ambiguous provenance rather than resolving. That is correct:
    the divergence is a property of the PAIR, not of either chunk.
    ASYMMETRY, and it is the point of the question: only progoti_0152
    states both programmes rule. dabi_2025_0136 states Dabi alone, so a
    Dabi-only retrieval cannot produce the Progoti half. Recorded in
    data/corpus_gaps.md section 7.

