    Pair confirmed from divergence.md: 866 chars each, one character
    apart. 16 renumbered-identical pairs exist; alternatives are
    §5.2.7/§5.2.6 and §4.4.4/§4.5.4 if this one reads poorly as a
    question.
    THE ONE DIFFERING CHARACTER IS THE CLAUSE NUMBER ITSELF, and it is in
    the heading, not the text: dabi_2025_0014 reads ১.১.২ and progoti_0021
    reads ১.১.৩ at offset 53 of display_text. The 734-character BODIES are
    byte-identical, so the renumbering is the entire difference between
    the two chunks.
    The two literal facts are THE SAME verbatim span, one per manual, so
    the claim is demonstrated rather than asserted: an answer must show
    the shared text under both numbers, not merely say they differ. The
    span is the shortest substantive sentence in the shared body (96 chars)
    that does not cross a newline. The raw display_text keeps each list label
    on its own line -- "১. প্রত্যাশা লোন:" is a 17-character heading line --
    so a span taken from a newline-flattened copy of the body glued that label
    to the sentence and was then NOT byte-exact in the chunk. validate_gold
    caught it. Quote spans from display_text as stored, never from a
    whitespace-normalised copy.
    These two chunks are NOT a dedupe dup_group, because dedupe compares
    the body with its heading line peeled off -- identical bodies, so the
    pair is caught by dupscan's clause-divergence report instead.

