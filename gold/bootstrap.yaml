# gold/bootstrap.yaml — Dabi 2025 + Progoti 2025
#
# 24 questions. question_bn is written; gold_facts, source_refs and the
# figures are yours to fill while reading the chunk and the page image.
#
# WRITE IN THE ORDER THIS FILE IS ARRANGED, not by id. Blocks A and B need no
# figures at all — they come off forbidden.json and divergence.md, which
# Claude Code has already built. Block C is the slow part.
#
# EVERY QUESTION HERE IS chunk_derived. These test retrieval mechanics. They
# do not cover officer vocabulary and do not substitute for the 50 field
# questions.
#
# FILL RULES
#   - gold_facts: the Bengali literal or the figure. English goes in notes.
#     Prose facts need --judge llm, which is an API call per fact and a
#     second thing that can be wrong.
#   - one atomic fact per entry. Never bundle three into a sentence.
#   - verified_against: corpus  until the page has been read.
#   - verification_status: unverified  until you and your colleague have
#     checked it against the printed manual.
#   - TODO markers are deliberate. validate_gold.py should fail on any
#     remaining TODO only under --strict, so nothing half-written scores.
#
# FACT KINDS (added 2026-09-15, after validate_gold.py flagged 22 facts)
#   kind: literal   occurs verbatim in the chunk named by its ref.
#                   Figures, role names, product names. Verbatim-checkable.
#   kind: absent    must NOT occur anywhere in the corpus. Its evidence is
#                   absence — no chunk can contain it, and if one did the
#                   fact would be false. ref points at the clause that
#                   SHOULD have carried it, for navigation only.
#   kind: claim     a paraphrase with no literal to quote, e.g. "§7.1 covers
#                   only procurement limits". Needs --judge llm to score.
#   default is literal. Block A is mostly absent/claim; Block C is mostly
#   literal.
#
#   ref: <chunk_id>  optional, per fact, resolving against the question's
#                    source_refs list. Required where a question's facts
#                    span more than one chunk or manual (G-214, G-215).
#
# SOURCE REFERENCE SCHEMA (revised 2026-09-15)
#   CLAUSE is the reference, not page. A .docx has no pagination until it is
#   rendered, so 831 of 867 chunks carry no page number, and rendering the
#   docx through LibreOffice would produce page numbers that do NOT match
#   the printed manual a colleague is holding — worse than having none.
#   Verification instruction is "look up §5.3.1", which is how the manual is
#   navigated anyway and is stable across renderings.
#     required: chunk_id, manual_id, clause
#     optional: page, render  — only for chunks that genuinely carry a page
#               (the 36 livestock_grow_2026 chunks)

meta:
  version: 1
  created: 2026-09-15
  manuals: [dabi_2025, progoti]
  provenance: chunk_derived
  note: >
    Answerable/unanswerable split is 19/5, about 21% unanswerable. Every
    unanswerable question here is a documented gap an officer will actually
    ask about, and the failure mode is confident invention, not silence.
  pending_verification: >
    All facts enter as verified_against: corpus and
    verification_status: unverified. Do not pass --require-render until the
    page checks are done with a colleague against the source manuals.

questions:

