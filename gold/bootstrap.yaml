- id: G-218
  type: unanswerable_undefined
  provenance: chunk_derived
  question_bn: "বিসিইউপি এর পূর্ণরূপ কী?"
  question_variants:
    - "সিডিপি মানে কী?"
  manual_scope: any
  answerable: "no"
  gold_facts:
    - text: "পূর্ণরূপ কোন ম্যানুয়ালে উল্লেখ নেই"
      kind: absent
      verified_against: corpus
    - text: "বিসিইউপি, সিডিপি, এনসিডিপি ও এসসিডিপি — চারটি কর্মসূচির সংক্ষিপ্ত রূপ ম্যানুয়ালে কোথাও সম্প্রসারিত করা হয়নি"
      kind: claim
      verified_against: corpus
  must_cite: []
  must_not_contain_literals: []
  # Nothing forbiddable yet: there are no numbers, and seeding invented
  # expansions would be a synthetic trap. Abstention accuracy still scores
  # this question. Backfill must_not_contain_literals with whatever the
  # first real run invents — a real observed failure is the only kind worth
  # encoding.
  source_refs:
    - chunk_id: TODO          # any chunk using the acronym undefined
      manual_id: dabi_2025
      clause: TODO
  verification_status: unverified
  difficulty: medium
  notes: >
    Four programme acronyms unexpanded across 282 occurrences in 134 chunks
    — বিসিইউপি 102, সিডিপি 22, এনসিডিপি 78, এসসিডিপি 80. A model will
    happily generate a plausible Bangla expansion. After the first run, put
    whatever it invents into must_not_contain_literals: that is a real
    observed failure, which is the only kind worth encoding.
    COUNTED BOUNDARY-AWARE, and the method is part of the fact. সিডিপি is a
    SUBSTRING of both এনসিডিপি and এসসিডিপি, so a naive str.count gives 180
    for সিডিপি alone and 440 for the four — the number this note carried
    before (194) matches neither reading and was replaced on 2026-09-17. The
    boundary-aware count excludes সিডিপি preceded by এন or এস. See
    PROJECT_JOURNAL.md 5.2 instance 5 and 5.3 instance 12.

