- id: G-217
  type: unanswerable_undefined
  provenance: chunk_derived
  question_bn: "আরোগ্য ঋণের ঋণসীমা, মেয়াদ ও সার্ভিস চার্জ কত?"
  manual_scope: any
  answerable: "no"
  gold_facts:
    - text: "আরোগ্য ঋণের ঋণসীমা বা মেয়াদ ম্যানুয়ালে নেই"
      kind: absent
      verified_against: corpus
    - text: "আরোগ্য ঋণের গ্রাহক এই বিমা সুবিধার আওতায় আসবেনা"
      kind: literal          # quoted from §5.1.2 — check it matches exactly
      ref: dabi_2025_0186
      verified_against: corpus
  must_cite: ["dabi_2025 §5.1.2", "progoti §5.1.2"]
  forbidden_numbers_from_clause: ["dabi_2025 §1.1"]
  source_refs:
    - chunk_id: dabi_2025_0186   # §5.1.2, the exclusion rule
      manual_id: dabi_2025
      clause: "৫.১.২"
    - chunk_id: dabi_2025_0003   # সূচনা — the intro listing it as an offering
